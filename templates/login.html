<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingia - Mauzo Kiganjani</title>
  <style>
    :root {
      --navy: #1e3a8a;
      --blue: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      border-top: 5px solid var(--navy);
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; color: var(--navy); }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--navy); }
    .links {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }
    .links a { color: var(--blue); text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mauzo Kiganjani</h1>
    <p class="sub">Ingia kwenye akaunti yako ya biashara</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Ingia</button>
    </form>

    <div class="links">
      <a href="{% url 'accounts:password_reset' %}">Forgot Password?</a>
      <a href="{% url 'accounts:register' %}">Jisajili Biashara</a>
    </div>
  </div>
</body>
</html>
