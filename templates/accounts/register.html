<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jisajili - Mauzo Kiganjani</title>
  <style>
    :root {
      --navy: #1e3a8a;
      --blue: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .card {
      max-width: 540px;
      margin: 20px auto;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      border-top: 5px solid var(--navy);
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; color: var(--navy); }
    p.sub { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
    p { margin: 0 0 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
    }
    .helptext { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
    button {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { background: var(--navy); }
    .footer-link { margin-top: 16px; text-align: center; font-size: 0.92rem; }
    .footer-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jisajili - Mauzo Kiganjani</h1>
    <p class="sub">Chagua kwa makini Jumla au Rejareja — chaguo hili litafungwa baada ya kujisajili.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Kamilisha Usajili</button>
    </form>

    <div class="footer-link">
      Tayari una akaunti? <a href="{% url 'accounts:login' %}">Ingia hapa</a>
    </div>
  </div>
</body>
</html>
